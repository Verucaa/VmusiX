name: build

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md', 'LICENSE', 'docs/**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Ditaruh di level job supaya SETIAP step (termasuk `if:`) bisa membacanya.
    env:
      VMUSIX_KEYSTORE_B64: ${{ secrets.VMUSIX_KEYSTORE_B64 }}
      VMUSIX_KEYSTORE_PASSWORD: ${{ secrets.VMUSIX_KEYSTORE_PASSWORD }}
      VMUSIX_KEY_ALIAS: ${{ secrets.VMUSIX_KEY_ALIAS }}
      VMUSIX_KEY_PASSWORD: ${{ secrets.VMUSIX_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Wrapper dipakai, bukan `gradle` telanjang: contributor lokal dan CI
      # jadi dijamin build dengan versi Gradle yang sama persis.
      - uses: gradle/actions/setup-gradle@v4

      - name: Accept SDK licenses + install platform
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-35" "build-tools;35.0.0"

      # Signing dilakukan DI DALAM Gradle (app/build.gradle.kts membaca
      # VMUSIX_KEYSTORE* dari env). Dulu signing dilakukan lagi lewat
      # apksigner di sini — itu rusak: kalau env sudah terisi, AGP
      # menghasilkan APK bertanda tangan dan apksigner menolaknya.
      - name: Build release APK
        run: |
          set -euo pipefail
          if [ -n "${VMUSIX_KEYSTORE_B64:-}" ]; then
            printf '%s' "$VMUSIX_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/vmusix-release.jks"
            export VMUSIX_KEYSTORE="$RUNNER_TEMP/vmusix-release.jks"
            chmod 600 "$VMUSIX_KEYSTORE"
            echo "Signing aktif (keystore dari Secrets)."
          else
            echo "::warning::Secret keystore belum diisi — APK release akan UNSIGNED dan tidak bisa dipasang. Lihat README bagian Signing."
          fi
          ./gradlew :app:assembleRelease --stacktrace
          rm -f "$RUNNER_TEMP/vmusix-release.jks"

      - name: Verify signature
        if: env.VMUSIX_KEYSTORE_B64 != ''
        run: |
          set -euo pipefail
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "Verifikasi: $APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: VmusiX-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # Hanya saat dipicu tag. Dulu TAG di-hardcode "v1.0.0", jadi push tag
      # v1.0.1 justru menimpa APK ke release v1.0.0.
      - name: Publish ke GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          KEYSTORE_B64: ${{ secrets.VMUSIX_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "Tidak ada keystore — lewati publish agar APK unsigned tidak sampai ke user."
            exit 0
          fi
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "VmusiX $TAG" --generate-notes
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          NAME="VmusiX-$TAG-$(git rev-parse --short HEAD)-signed.apk"
          cp "$APK" "$RUNNER_TEMP/$NAME"
          gh release upload "$TAG" "$RUNNER_TEMP/$NAME" --clobber
          # Hanya asset build terakhir per tag yang disimpan.
          for a in $(gh release view "$TAG" --json assets -q '.assets[].name' \
                      | grep "^VmusiX-$TAG-.*-signed\.apk$" | grep -v "^$NAME$"); do
            gh release delete-asset "$TAG" "$a" -y
          done
          echo "Upload: $NAME"
